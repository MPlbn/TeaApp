services:
  tea-database:
    image: postgres:18
    container_name: teaapp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: ./backend/TeaApp.Api
      dockerfile: Dockerfile
    container_name: teaapp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__TeaDatabase: "${API_CONNECTION_STRING}"
    ports:
      - "8080:8080"
    depends_on:
      - tea-database

volumes:
  postgres_data: